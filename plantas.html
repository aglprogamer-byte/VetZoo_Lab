<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantas Tóxicas de Importancia Veterinaria | Vet & Zoo Lab</title>
  <meta name="description" content="Guía clínica y atlas de plantas tóxicas tropicales y andinas para rumiantes y equinos: fotosensibilización, cardiotóxicas, alcaloides pirrolizidínicos y quiz.">
  <link href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" rel="icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>
  <!-- Contenedor Toast -->
  <div class="fixed right-4 top-4 z-50 max-w-sm space-y-2" id="toast"></div>

  <!-- Barra de Navegación Global -->
  <header class="max-w-7xl mx-auto px-4 pt-4" id="sharedNavContainer"></header>

  <!-- Contenedor Principal de Plantas Tóxicas -->
  <main class="max-w-7xl mx-auto px-4 pt-4 pb-16 space-y-6">
    <div class="glass hud-card rounded-3xl p-6 sm:p-8 space-y-6" id="plantsModuleRoot">
      <!-- Encabezado -->
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-[var(--border)] pb-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-2xl shadow-inner">
            🌿
          </div>
          <div>
            <h2 class="display text-xl sm:text-2xl font-bold text-white m-0">Guía Clínica de Plantas Tóxicas Regionales</h2>
            <p class="text-xs text-[var(--muted)] m-0">Catálogo toxicológico, patogenia, cuadros clínicos, antídotos y quiz interactivo de casos.</p>
          </div>
        </div>

        <!-- Botones de Modo -->
        <div class="flex gap-2 bg-black/40 p-1 rounded-2xl border border-[var(--border)]">
          <button class="btn px-4 py-1.5 rounded-xl text-xs font-semibold bg-emerald-950/80 text-emerald-300 border border-emerald-500/40" id="btnTabCatalog">
            📚 Catálogo Botánico (18)
          </button>
          <button class="btn px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white" id="btnTabQuiz">
            🧠 Quiz de Casos Toxicológicos
          </button>
        </div>
      </div>

      <!-- Vista 1: Catálogo Filtrable -->
      <div class="space-y-4" id="plantsCatalogView">
        <!-- Barra de Búsqueda y Filtros -->
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex-1 min-w-[260px]">
            <input class="w-full bg-black/50 border border-[var(--border)] rounded-xl p-2.5 text-xs text-white" id="inputSearchPlant" type="text" placeholder="🔍 Buscar por nombre común, científico o principio activo...">
          </div>

          <div class="flex flex-wrap gap-1.5 text-xs" id="plantFilterButtons">
            <button class="btn-pf btn px-3 py-1 rounded-lg border bg-white/10 text-white border-white/20 text-[11px]" data-filter="all">Todas</button>
            <button class="btn-pf btn px-3 py-1 rounded-lg border text-gray-400 border-white/5 text-[11px]" data-filter="Bovinos">🐄 Bovinos</button>
            <button class="btn-pf btn px-3 py-1 rounded-lg border text-gray-400 border-white/5 text-[11px]" data-filter="Equinos">🐎 Equinos</button>
            <button class="btn-pf btn px-3 py-1 rounded-lg border text-gray-400 border-white/5 text-[11px]" data-filter="Ovinos">🐑 Ovinos</button>
          </div>
        </div>

        <!-- Grid de Plantas -->
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4" id="plantsGridContainer"></div>
      </div>

      <!-- Vista 2: Quiz Clínico -->
      <div class="hidden space-y-6" id="plantsQuizView"></div>
    </div>
  </main>

  <!-- Footer Científico -->
  <footer class="max-w-7xl mx-auto px-4 pb-8 text-center text-xs text-[var(--muted)] border-t border-[var(--border)] pt-4">
    🌿 VET & ZOO LAB — Centro de Toxicología Veterinaria, Fitoquímica & Medicina Preventiva de Pasturas.
  </footer>

  <!-- Script Bootstrap -->
  <script type="module">
    import { SharedNav } from "./js/ui/SharedNav.js";
    import { toxicPlantsEngine } from "./js/modules/ToxicPlantsDB.js";
    import { achievements } from "./js/core/Achievements.js";

    let activeFilter = "all";
    let searchQuery = "";

    function renderCatalog() {
      const container = document.getElementById("plantsGridContainer");
      if (!container) return;

      let list = toxicPlantsEngine.plants;
      if (activeFilter !== "all") {
        list = toxicPlantsEngine.filterBySpecies(activeFilter);
      }
      if (searchQuery.trim()) {
        list = list.filter(p =>
          p.commonName.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.scientificName.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.toxicPrinciple.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }

      container.innerHTML = list.map(p => {
        const severityBg = p.severity === "Extrema" ? "bg-rose-950/80 border-rose-500/50 text-rose-300" :
                           p.severity === "Muy Alta" ? "bg-amber-950/80 border-amber-500/50 text-amber-300" : "bg-emerald-950/80 border-emerald-500/50 text-emerald-300";

        return `
          <div class="glass p-5 rounded-2xl border border-[var(--border)] bg-black/40 space-y-3 hover:border-emerald-500/50 transition">
            <div class="flex items-start justify-between gap-2 border-b border-white/10 pb-2.5">
              <div class="flex items-center gap-2.5">
                <span class="text-3xl">${p.icon}</span>
                <div>
                  <b class="text-sm text-white block">${p.commonName}</b>
                  <i class="text-xs text-emerald-300">${p.scientificName}</i>
                </div>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[9px] font-bold border ${severityBg}">${p.severity}</span>
            </div>

            <div class="space-y-1.5 text-xs text-gray-300">
              <div><b class="text-amber-300 mono text-[10px] uppercase">Toxina:</b> <span class="text-gray-200">${p.toxicPrinciple}</span></div>
              <div><b class="text-blue-300 mono text-[10px] uppercase">Especies:</b> <span class="text-gray-300">${p.speciesAffected.join(", ")}</span></div>
              <div><b class="text-emerald-300 mono text-[10px] uppercase">Cuadro Clínico:</b> <p class="text-gray-300 leading-relaxed m-0 mt-0.5 line-clamp-3">${p.clinicalSigns}</p></div>
            </div>

            <div class="pt-2 border-t border-white/5 text-[11px] text-gray-400">
              <b class="text-white">Tratamiento:</b> ${p.treatment}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderQuiz() {
      const qView = document.getElementById("plantsQuizView");
      if (!qView) return;

      const q = toxicPlantsEngine.getCurrentQuiz();
      if (!q) return;

      qView.innerHTML = `
        <div class="glass p-6 sm:p-8 rounded-3xl border border-emerald-500/40 bg-black/60 max-w-3xl mx-auto space-y-6 shadow-2xl">
          <div class="flex justify-between items-center border-b border-white/10 pb-3">
            <span class="badge-tag bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs">CASO TOXICOLÓGICO #${toxicPlantsEngine.quizState.currentQuizIndex + 1} DE ${toxicPlantsEngine.quizzes.length}</span>
            <span class="mono text-xs text-amber-300 font-bold">Aciertos: ${toxicPlantsEngine.quizState.score}</span>
          </div>

          <div class="space-y-3">
            <h3 class="display font-bold text-white text-base m-0">Escenario Clínico en Campo</h3>
            <div class="p-4 rounded-2xl bg-black/60 border border-white/10 text-xs text-gray-200 leading-relaxed">
              ${q.scenario}
            </div>
          </div>

          <div class="space-y-3">
            <b class="text-emerald-300 text-xs block">${q.question}</b>
            <div class="space-y-2">
              ${q.options.map(opt => `
                <button class="btn-opt-quiz btn w-full p-3.5 rounded-xl border border-white/10 bg-black/40 hover:bg-white/5 text-left text-xs text-gray-200 transition" data-opt="${opt.id}">
                  ${opt.text}
                </button>
              `).join("")}
            </div>
          </div>

          <div id="plantQuizFeedbackBox" class="hidden p-4 rounded-xl text-xs space-y-2"></div>

          <div class="flex justify-end pt-2">
            <button id="btnNextPlantQuiz" class="btn px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow">
              Siguiente Caso ➡️
            </button>
          </div>
        </div>
      `;

      qView.querySelectorAll(".btn-opt-quiz").forEach(btn => {
        btn.onclick = () => {
          const res = toxicPlantsEngine.submitQuizAnswer(q.id, btn.dataset.opt);
          const fb = qView.querySelector("#plantQuizFeedbackBox");
          if (!fb) return;

          achievements.recordPlantQuiz(res.correct);
          fb.classList.remove("hidden", "bg-emerald-950/80", "border-emerald-500/40", "bg-rose-950/80", "border-rose-500/40");

          if (res.correct) {
            fb.classList.add("bg-emerald-950/80", "border", "border-emerald-500/40", "text-emerald-200");
            fb.innerHTML = `
              <div class="font-bold flex items-center gap-1.5 text-sm">
                <span>✅</span> ¡Diagnóstico Toxicológico Exacto!
              </div>
              <p class="text-xs text-gray-200 leading-relaxed m-0">${res.explanation}</p>
            `;
          } else {
            fb.classList.add("bg-rose-950/80", "border", "border-rose-500/40", "text-rose-200");
            fb.innerHTML = `
              <div class="font-bold flex items-center gap-1.5 text-sm">
                <span>❌</span> Diagnóstico Erróneo
              </div>
              <p class="text-xs text-gray-300 leading-relaxed m-0"><b>Respuesta correcta:</b> ${res.correctAnswer}. ${res.explanation}</p>
            `;
          }
        };
      });

      const btnNext = qView.querySelector("#btnNextPlantQuiz");
      if (btnNext) {
        btnNext.onclick = () => {
          if (!toxicPlantsEngine.nextQuiz()) {
            toxicPlantsEngine.resetQuiz();
          }
          renderQuiz();
        };
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      new SharedNav("plantas");
      renderCatalog();

      const btnCat = document.getElementById("btnTabCatalog");
      const btnQz = document.getElementById("btnTabQuiz");
      const catView = document.getElementById("plantsCatalogView");
      const qzView = document.getElementById("plantsQuizView");

      if (btnCat && btnQz && catView && qzView) {
        btnCat.onclick = () => {
          catView.classList.remove("hidden");
          qzView.classList.add("hidden");
          btnCat.className = "btn px-4 py-1.5 rounded-xl text-xs font-semibold bg-emerald-950/80 text-emerald-300 border border-emerald-500/40";
          btnQz.className = "btn px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white";
        };

        btnQz.onclick = () => {
          qzView.classList.remove("hidden");
          catView.classList.add("hidden");
          btnQz.className = "btn px-4 py-1.5 rounded-xl text-xs font-semibold bg-emerald-950/80 text-emerald-300 border border-emerald-500/40";
          btnCat.className = "btn px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white";
          renderQuiz();
        };
      }

      document.querySelectorAll(".btn-pf").forEach(btn => {
        btn.onclick = () => {
          activeFilter = btn.dataset.filter;
          document.querySelectorAll(".btn-pf").forEach(b => b.className = "btn-pf btn px-3 py-1 rounded-lg border text-gray-400 border-white/5 text-[11px]");
          btn.className = "btn-pf btn px-3 py-1 rounded-lg border bg-white/10 text-white border-white/20 text-[11px]";
          renderCatalog();
        };
      });

      const sInput = document.getElementById("inputSearchPlant");
      if (sInput) {
        sInput.oninput = (e) => {
          searchQuery = e.target.value;
          renderCatalog();
        };
      }
    });
  </script>
</body>
</html>
