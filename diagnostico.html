<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico Clínico & Laboratorio Multiespecie | Vet & Zoo Lab</title>
  <meta name="description" content="Laboratorio de diagnóstico clínico veterinario multiespecie: hemograma interactivo, bioquímica sérica, coprología McMaster y simulador de punción tisular.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- Contenedor Toast -->
  <div id="toast" class="fixed right-4 top-4 z-50 max-w-sm space-y-2"></div>

  <!-- Barra de Navegación Global -->
  <header class="max-w-7xl mx-auto px-4 pt-4" id="sharedNavContainer"></header>

  <!-- Contenedor Principal del Laboratorio de Diagnóstico -->
  <main class="max-w-7xl mx-auto px-4 pt-4 pb-16">
    <div class="glass hud-card rounded-3xl p-6 sm:p-8" id="diagnosticLabContainer"></div>
  </main>

  <!-- Footer Científico -->
  <footer class="max-w-7xl mx-auto px-4 pb-8 text-center text-xs text-[var(--muted)] border-t border-[var(--border)] pt-4">
    🔬 VET & ZOO LAB — Centro de Diagnóstico Clínico, Hematología & Semiología Veterinaria.
  </footer>

  <!-- Script Bootstrap -->
  <script type="module">
    import { SharedNav } from "./js/ui/SharedNav.js";
    import { DiagnosticLab } from "./js/modules/DiagnosticLab.js";
    import { store } from "./js/core/Store.js";

    window.addEventListener("DOMContentLoaded", () => {
      new SharedNav("diagnostico");
      new DiagnosticLab("diagnosticLabContainer", { storeInstance: store });
    });
  </script>
</body>
</html>
